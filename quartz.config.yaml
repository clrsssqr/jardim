if: ${{ github.repository == 'jackyzha0/quartz' }}
Ou seja, ele só roda no repositório original do criador do Quartz. Precisamos criar um arquivo novo de deploy para o GitHub Pages. Roda esse comando no terminal:

type nul > .github\workflows\deploy.yml
Depois abre o Explorador de Arquivos, navega até C:\Users\clari\quartz\.github\workflows e abre o arquivo deploy.yml no Bloco de Notas. Cola esse conteúdo:

yaml
name: Deploy Quartz to GitHub Pages
on:
  push:
    branches:
      - v5
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx quartz build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
