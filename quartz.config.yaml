No arquivo quartz.config.yaml, o que é o page title sufix?

10:55
É um sufixo que aparece no título de todas as páginas do site, separado por um traço.

Por exemplo, se o seu pageTitle for Jardim da Clari e o pageTitleSuffix for  | Notas, todas as abas do navegador vão mostrar:

Nome da Nota | Notas

Por padrão está vazio (""), então não aparece nada. É opcional e muita gente deixa em branco mesmo.

Ok, obrigada. Esse arquivo que define o estilo das fontes, certo? O que mais ele faz?

10:56
Sim! O quartz.config.yaml é o arquivo central de configuração do site. Ele controla:

Visual

Fontes (header, body, código)
Cores do modo claro e escuro
Se as fontes vêm do Google Fonts ou local
Comportamento do site

enableSPA — navegação rápida entre páginas sem recarregar
enablePopovers — aquelas janelas que aparecem quando você passa o mouse em cima de um link
locale — idioma do site (dá pra mudar para pt-BR!)
Conteúdo

ignorePatterns — pastas que o Quartz ignora na hora de publicar (por padrão ignora a pasta private, ótimo pra notas que você não quer publicar)
baseUrl — o endereço do site
Plugins A lista enorme de plugins que ativa/desativa funcionalidades como gráfico de conexões, busca, tabela de conteúdo, backlinks, modo leitura, etc. Cada um tem enabled: true ou enabled: false.

Analytics Está configurado com Plausible por padrão, mas dá pra trocar ou desativar.

O mais útil pra você agora provavelmente é mudar o locale para pt-BR e explorar quais plugins deixar ativos. Quer que eu explique algum em específico?

O que é analytics?

10:57
Analytics é uma ferramenta que registra quem visita seu site. Ela coleta dados como:

Quantas pessoas acessaram
Quais páginas foram mais visitadas
De qual país vieram
Quanto tempo ficaram no site
Por qual link chegaram até você
O Quartz vem configurado com o Plausible por padrão, que é uma alternativa mais privada ao Google Analytics — não usa cookies e não rastreia dados pessoais dos visitantes.

Mas por enquanto ele não está funcionando de verdade, porque o Plausible é um serviço pago e precisaria de uma conta configurada. Como seu site é novo, você pode simplesmente desativar por enquanto mudando no quartz.config.yaml:

yaml
analytics:
  provider: none
Quando o site crescer e você quiser saber quantas pessoas estão lendo, aí vale a pena configurar. O Google Analytics é gratuito se quiser explorar no futuro.

