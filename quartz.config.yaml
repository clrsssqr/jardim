Aproveitei e notei mais duas coisinhas no arquivo:

1. O dark tem dois ## — vai causar erro de cor:

yaml
dark: "##610289"
Muda para:

yaml
dark: "#610289"
2. O explorer está com o title fora do lugar — precisa ficar dentro de options:

yaml
  - source: github:quartz-community/explorer
    enabled: true
    options:
      title: "Vasculhar"
    layout:
      position: left
      priority: 50
Faz as três correções, salva e publica! 😊


