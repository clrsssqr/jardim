Então, no meu domínio já uso um site do wix. Eu consigo nesse caso apontar para um subdomínio? Como: meusite.com/jardim

9 de jun.
Boa pergunta, mas tem um detalhe importante:

meusite.com/jardim não é um subdomínio — é um subdiretório (ou caminho). Subdomínio seria jardim.meusite.com.

O problema com /jardim
O Wix controla tudo que vem depois do seu domínio principal. Você não consegue apontar meusite.com/jardim pro Quartz enquanto o site principal está no Wix. Eles entrariam em conflito.

O que funciona ✅
jardim.meusite.com — esse sim é possível! Você cria um subdomínio e aponta só ele pro Quartz/GitHub Pages/Vercel, sem mexer no site do Wix.

Como ficaria na prática
meusite.com → continua sendo o Wix, sem nenhuma alteração
jardim.meusite.com → seria o seu digital garden no Quartz
A configuração é feita no painel do DNS do seu provedor de domínio, adicionando um registro apontando o subdomínio pro serviço de hospedagem. É bem simples.

Onde você registrou seu domínio?

Acho que no próprio wix

9 de jun.
Nesse caso fica um pouquinho mais limitado. O Wix permite criar subdomínios, mas só para serviços internos deles (como loja.meusite.com apontando pra uma loja Wix). Apontar um subdomínio para fora do Wix, como pro GitHub Pages ou Vercel, depende de você ter acesso ao DNS, e o Wix só libera isso em planos pagos mais avançados.

Suas opções:
1. Verificar se seu plano Wix tem acesso ao DNS Entra no painel do Wix em Configurações → Domínios → Gerenciar DNS. Se aparecer a opção de editar registros DNS, você consegue apontar o subdomínio.

2. Transferir o domínio para outro registrador Você pode mover seu domínio para o Registro.br, Cloudflare ou similar. O site do Wix continua funcionando normalmente, mas você ganha controle total do DNS. A Cloudflare inclusive é gratuita só para gerenciar DNS.

3. Usar um domínio novo só pro jardim Domínios .com.br custam em torno de R$ 40/ano no Registro.br. Seria o caminho mais simples e sem risco de mexer no que já funciona.

