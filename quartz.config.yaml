Como conserto esse erro:

18:35
É um erro de indentação no YAML — alguma linha ficou com espaços errados. O YAML é muito sensível a isso.

O jeito mais seguro é substituir o arquivo inteiro. Abre o quartz.config.yaml no Bloco de Notas, apaga tudo e cola esse conteúdo:

yaml
# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Clarisse Siqueira
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: none
  locale: en-US
  baseUrl: clrsssqr.github.io/jardim
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Raleway
      body: Raleway
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#e0dac5"
        lightgray: "#6bb192"
        gray: "#b8b8b8"
        darkgray: "#610289"
        dark: "#610289"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
