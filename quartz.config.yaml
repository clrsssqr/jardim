Esse erro é de permissão no GitHub Actions. Vamos corrigir abrindo o arquivo deploy.yml e adicionando permissões extras.

Abre o C:\Users\clari\quartz\.github\workflows\deploy.yml no Bloco de Notas e substitui todo o conteúdo por esse:

yaml
name: Deploy Quartz to GitHub Pages
on:
  push:
    branches:
      - v5
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --os=linux --cpu=x64 sharp
      - run: npx quartz plugin install
      - run: npx quartz build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
