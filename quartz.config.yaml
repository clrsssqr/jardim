Se isso for um problema, você tem duas opções:

1. Tornar o repositório privado No GitHub, vai em Settings → Danger Zone → Change visibility → Private. O site continua funcionando normalmente, mas o código fonte fica escondido.

⚠️ Repositórios privados com GitHub Pages gratuito têm uma limitação — você precisaria do plano GitHub Pro (~$4/mês).

2. Não colocar nada sensível na pasta private Usar ela só para rascunhos que não importa se alguém ver. É o que a maioria das pessoas faz.

