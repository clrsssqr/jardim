Claro! Vou explicar tudo antes de você começar.

Criando notas
Cada nota é um arquivo .md (Markdown) dentro da pasta C:\Users\clari\quartz\content. Você pode criar pelo Obsidian ou pelo Bloco de Notas mesmo. O nome do arquivo vira a URL da página — por exemplo, receitas.md fica em clrsssqr.github.io/quartz/receitas.

Ligando notas entre si
Você usa a sintaxe do Obsidian com colchetes duplos:

Veja também minhas [[receitas]] favoritas.
Isso cria um link clicável apontando para o arquivo receitas.md. O Quartz também gera automaticamente o gráfico de conexões mostrando quais notas se ligam entre si.

Pasta private
Qualquer nota dentro de uma pasta chamada private não é publicada. Por exemplo:

content/
  private/
    rascunhos.md   ← não aparece no site
  receitas.md      ← aparece no site
Isso já está configurado no quartz.config.yaml na linha ignorePatterns.

Organização em pastas
Você pode criar subpastas dentro de content à vontade:

content/
  culinaria/
    receitas.md
    restaurantes.md
  leituras/
    livros.md
Cada pasta vira uma seção no explorer do seu site automaticamente.

