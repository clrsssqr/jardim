Acho que vou fazer no github por enquanto mesmo. Mas me conta como o github ganha dinheiro se hospeda de graça?

9 de jun.
Boa pergunta! O GitHub foi comprado pela Microsoft em 2018 por US$ 7,5 bilhões, e o modelo de negócio é basicamente o clássico freemium:

Como eles ganham dinheiro:
Planos pagos para times e empresas O GitHub Free é generoso, mas empresas pagam pelo GitHub Team (~$4/usuário/mês) ou GitHub Enterprise (~$21/usuário/mês) para ter recursos como proteção de branches, SSO, auditoria, etc.

GitHub Copilot O assistente de IA pra programadores é pago (~$10/mês pessoa física, mais caro para empresas). Esse virou uma fonte de receita enorme nos últimos anos.

GitHub Actions (minutos extras) A automação de tarefas tem uma cota gratuita, mas empresas com projetos grandes pagam por minutos adicionais.

GitHub Advanced Security Ferramentas de segurança de código para empresas grandes, bem caro.

Por que oferecem tanto de graça?
É estratégia. Quanto mais desenvolvedores usam o GitHub gratuitamente, mais as empresas onde eles trabalham acabam pagando pelos planos corporativos. O desenvolvedor vira o "vendedor" sem saber.

Além disso, a Microsoft tem interesse em manter o ecossistema de desenvolvedores próximo dos produtos dela (Azure, VS Code, Copilot...).

É um negócio bem redondo. 😄

